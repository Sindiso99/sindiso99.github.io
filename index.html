<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTHE</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            transition: all 0.5s ease;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(0px);
            z-index: -1;
            transition: filter 0.5s ease;
        }
        body.hover-active::before {
            filter: blur(15px);
        }
        body.hover-active {
            color: white;
        }
        .header { background: #f8f8f8; padding: 20px; text-align: center; transition: all 0.5s ease; }
        body.hover-active .header { background: rgba(0, 0, 0, 0.3); }
        .portfolio { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; padding: 10px; }
        .portfolio-item { border: 1px solid #ccc; padding: 10px; text-align: center; transition: all 0.3s ease; }
        body.hover-active .portfolio-item { border-color: rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.2); }
        img { max-width: 100%; height: auto; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to My Art Portfolio</h1>
        <p>Have a gander.</p>
    </div>
    <div class="portfolio">
        <div class="portfolio-item">
            <img src="bramble_white_bottom.PNG" alt="Bramble" 
                 onmouseover="setBackground('bramble_white_bottom.PNG'); document.body.classList.add('hover-active')" 
                 onmouseout="clearBackground(); document.body.classList.remove('hover-active')">
            <p>Bramble. Oil on Canvas</p>
        </div>
        <div class="portfolio-item">
            <img src="art2.jpg" alt="Art Piece 2">
            <p>Art Piece 2 Description</p>
        </div>
        <div class="portfolio-item">
            <img src="art3.jpg" alt="Art Piece 3">
            <p>Art Piece 3 Description</p>
        </div>
    </div>

    <script>
        function setBackground(imageSrc) {
            document.body.style.backgroundImage = `url('${imageSrc}')`;
        }
        function clearBackground() {
            document.body.style.backgroundImage = '';
        }
    </script>
</body>
</html>

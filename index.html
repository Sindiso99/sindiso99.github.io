<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTHE</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: black;
            color: white;
            --bg-image-1: none;
            --bg-image-2: none;
        }

        /* TWO LAYERS FOR TRUE CROSSFade */
        body::before,
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(20px);
            z-index: -1;
            transition: opacity 0.6s ease;
        }

        body::before {
            background-image: var(--bg-image-1);
            opacity: 1;
        }

        body::after {
            background-image: var(--bg-image-2);
            opacity: 0;
        }

        /* Crossfade toggle */
        body.crossfade::before {
            opacity: 0;
        }

        body.crossfade::after {
            opacity: 1;
        }

        /* Optional: only show when hovering */
        body:not(.hover-active)::before,
        body:not(.hover-active)::after {
            opacity: 0;
        }

        .header { 
            padding: 20px; 
            text-align: center; 
        }

        .header h1 {
            cursor: pointer;
        }

        .portfolio { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 10px; 
            padding: 10px; 
        }

        .portfolio-item { 
            border: 1px solid rgba(255,255,255,0.3); 
            padding: 10px; 
            text-align: center; 
            background: rgba(0,0,0,0.2);
        }

        img { 
            max-width: 100%; 
            height: auto; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 onmouseover="clearBackground()">Welcome to My Art Portfolio</h1>
        <p>Have a gander.</p>
    </div>

    <div class="portfolio">
        <div class="portfolio-item">
            <img src="bramble_white_bottom.PNG" alt="Bramble" 
                 onmouseover="setBackground(this.src)">
            <p>Bramble. Oil on Canvas</p>
        </div>

        <div class="portfolio-item">
            <img src="solice_main.PNG" alt="Solice"
                 onmouseover="setBackground(this.src)">
            <p>Solice. Mixed media on Canvas</p>
        </div>

        <div class="portfolio-item">
            <img src="art3.jpg" alt="Art Piece 3"
                 onmouseover="setBackground(this.src)">
            <p>Art Piece 3 Description</p>
        </div>
    </div>

    <script>
        let showingFirst = true;

        function setBackground(imageSrc) {
            const newBg = `url('${imageSrc}')`;

            if (showingFirst) {
                document.body.style.setProperty('--bg-image-2', newBg);
            } else {
                document.body.style.setProperty('--bg-image-1', newBg);
            }

            document.body.classList.toggle('crossfade');
            showingFirst = !showingFirst;

            document.body.classList.add('hover-active');
        }

        function clearBackground() {
            document.body.classList.remove('hover-active');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .header { background: #f8f8f8; padding: 20px; text-align: center; }
        .portfolio { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 10px; }
        .portfolio-item { border: 1px solid #ccc; padding: 10px; text-align: center; }
        img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to My Art Portfolio</h1>
        <p>Explore my artwork and creative projects.</p>
    </div>
    <div class="portfolio">
        <div class="portfolio-item">
            <img src="art1.jpg" alt="Art Piece 1">
            <p>Art Piece 1 Description</p>
        </div>
        <div class="portfolio-item">
            <img src="art2.jpg" alt="Art Piece 2">
            <p>Art Piece 2 Description</p>
        </div>
        <div class="portfolio-item">
            <img src="art3.jpg" alt="Art Piece 3">
            <p>Art Piece 3 Description</p>
        </div>
        <!-- Add more art pieces as needed -->
    </div>
</body>
</html>
